<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Build Details — SFSW</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .build-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--c-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color .15s;
    }
    .build-back:hover { color: var(--c-gold); }

    /* ── Photo grid — all photos shown side by side ── */
    .detail-photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .detail-photo {
      position: relative;
      background: #0d0f11;
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: zoom-in;
    }
    .detail-photo img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      transition: transform .25s ease;
    }
    .detail-photo:hover img { transform: scale(1.04); }

    /* ── Header ── */
    .detail-header { margin-bottom: 2.5rem; }
    .detail-rod-type {
      font-family: var(--font-cond);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--c-text);
      margin-bottom: .35rem;
    }
    .detail-subtitle {
      font-size: 15px;
      color: var(--c-gold);
      font-family: var(--font-cond);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Spec breakdown ── */
    .detail-specs-title {
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--c-muted);
      margin-bottom: 1rem;
    }
    .detail-specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1px;
      background: var(--c-border);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .detail-spec {
      background: var(--c-dark2);
      padding: .9rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .detail-spec-label {
      color: var(--c-muted);
      font-family: var(--font-cond);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .detail-spec-value { color: var(--c-text); font-size: 14px; }

    .detail-notes {
      padding: 1.25rem 1.5rem;
      background: var(--c-dark2);
      border: 1px solid var(--c-border);
      border-left: 3px solid var(--c-gold);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--c-muted);
      line-height: 1.7;
      font-style: italic;
      margin-bottom: 2.5rem;
    }

    /* ── Lightbox ── */
    .detail-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5,7,9,.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 3rem 1.5rem;
      cursor: zoom-out;
    }
    .detail-lightbox.open { display: flex; }
    .detail-lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    .detail-lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      background: none;
      border: none;
      color: var(--c-text);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .build-not-found {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--c-muted);
    }

    @media (max-width: 600px) {
      .detail-rod-type { font-size: 26px; }
    }
  </style>
</head>
<body>
<div id="nav-mount"></div>

<section class="section">
  <div class="section-inner" id="build-detail-root">
    <!-- rendered by JS -->
  </div>
</section>

<div class="detail-lightbox" id="detail-lightbox" onclick="closeDetailLightbox()">
  <button class="detail-lightbox-close" onclick="closeDetailLightbox()" aria-label="Close">×</button>
  <img id="detail-lightbox-img" src="" alt="">
</div>

<div id="footer-mount"></div>
<script src="../js/sfsw.js"></script>
<script src="../js/builds-data.js"></script>
<script>
  document.getElementById('nav-mount').innerHTML = buildNav('Builds');
  document.getElementById('footer-mount').innerHTML = buildFooter();

  // This is the permanent detail view for a single build.
  function getBuildIdFromUrl() {
    return 'saltwater-baitcaster-rainshadow-sw-01';
  }

  function openDetailLightbox(src, alt) {
    const lb = document.getElementById('detail-lightbox');
    const img = document.getElementById('detail-lightbox-img');
    img.src = src;
    img.alt = alt || '';
    lb.classList.add('open');
  }
  function closeDetailLightbox() {
    document.getElementById('detail-lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetailLightbox(); });

  function renderBuildDetail() {
    const root = document.getElementById('build-detail-root');
    const id = getBuildIdFromUrl();
    const build = BUILDS.find(b => b.id === id);

    if (!build) {
      root.innerHTML = `
        <a href="builds.html" class="build-back">← All Builds</a>
        <div class="build-not-found">
          <p>We couldn't find that build.</p>
          <p><a href="builds.html" style="color:var(--c-gold)">View all builds →</a></p>
        </div>
      `;
      document.title = 'Build Not Found — SFSW';
      return;
    }

    document.title = `${build.rodType} — SFSW`;

    const photosHtml = build.photos.map((src, i) => `
      <div class="detail-photo" onclick="openDetailLightbox('${src}','${build.rodType} photo ${i+1}')">
        <img src="${src}" alt="${build.rodType} Custom Fishing Rod Build - South Florida Saltwater, photo ${i+1}" loading="lazy">
      </div>
    `).join('');

    const specsHtml = build.specs.map(s => `
      <div class="detail-spec">
        <span class="detail-spec-label">${s.label}</span>
        <span class="detail-spec-value">${s.value}</span>
      </div>
    `).join('');

    root.innerHTML = `
      <a href="builds.html" class="build-back">← All Builds</a>
      <div class="detail-header">
        <div class="detail-rod-type">${build.rodType}</div>
        <div class="detail-subtitle">${build.subtitle}</div>
      </div>
      <div class="detail-photo-grid">${photosHtml}</div>
      ${build.notes ? `<div class="detail-notes">${build.notes}</div>` : ''}
      <div class="detail-specs-title">Full Spec Breakdown</div>
      <div class="detail-specs-grid">${specsHtml}</div>
    `;
  }

  renderBuildDetail();
</script>
</body>
</html>
