<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Builds — SFSW</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .builds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }

    .build-card {
      background: var(--c-dark2);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .build-card:hover {
      border-color: var(--c-gold);
      transform: translateY(-2px);
    }

    /* ── Photo carousel ── */
    .carousel {
      position: relative;
      background: #0d0f11;
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform .35s ease;
    }

    .carousel-slide {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(13,15,17,.75);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--c-text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background .15s;
      z-index: 2;
    }
    .carousel-btn:hover { background: rgba(200,169,110,.25); }
    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }
    .carousel-btn.hidden { display: none; }

    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      cursor: pointer;
      transition: background .15s;
    }
    .carousel-dot.active { background: var(--c-gold); }

    .carousel-count {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: var(--font-cond);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      color: rgba(255,255,255,.6);
      background: rgba(0,0,0,.5);
      padding: 2px 7px;
      border-radius: 10px;
      z-index: 2;
    }

    /* ── Build info ── */
    .build-info { padding: 1.25rem; }

    .build-rod-type {
      font-family: var(--font-cond);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--c-text);
      margin-bottom: .25rem;
    }

    .build-subtitle {
      font-size: 12px;
      color: var(--c-gold);
      font-family: var(--font-cond);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .build-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .35rem .75rem;
    }

    .build-spec {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .build-spec-label {
      color: var(--c-muted);
      font-family: var(--font-cond);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .build-spec-value { color: var(--c-text); }

    .build-notes {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--c-border);
      font-size: 13px;
      color: var(--c-muted);
      line-height: 1.65;
      font-style: italic;
    }

    .build-view-link {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--c-border);
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--c-gold);
    }

    @media (max-width: 600px) {
      .builds-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="nav-mount"></div>

<div class="page-hero">
  <h1 class="page-hero-title">Completed <em>Orders</em></h1>
</div>
<hr class="divider">

<section class="section">
  <div class="section-inner">
    <div class="builds-grid" id="builds-grid"></div>
  </div>
</section>

<div id="footer-mount"></div>
<script src="../js/sfsw.js"></script>
<script src="../js/builds-data.js"></script>
<script>
  document.getElementById('nav-mount').innerHTML = buildNav('Builds');
  document.getElementById('footer-mount').innerHTML = buildFooter();

  // BUILDS array is loaded from ../js/builds-data.js (shared with each build
  // detail page, e.g. build1.html, build2.html, etc.).

  function goToBuild(page) {
    window.location.href = page;
  }

  // Shuffle a copy of BUILDS so the display order is randomized on every page load
  // (Fisher–Yates) without mutating the shared BUILDS array from builds-data.js.
  function shuffledBuilds() {
    const arr = BUILDS.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const RENDER_BUILDS = shuffledBuilds();

  // ── Render ──
  function renderBuilds() {
    const grid = document.getElementById('builds-grid');
    grid.innerHTML = RENDER_BUILDS.map((b, bi) => {
      const hasMultiple = b.photos.length > 1;
      const slidesHtml = b.photos.map(src => `
        <div class="carousel-slide">
          <img src="${src}" alt="${b.rodType} Custom Fishing Rod Build - South Florida Saltwater" loading="lazy">
        </div>
      `).join('');

      const dotsHtml = hasMultiple
        ? `<div class="carousel-dots">${b.photos.map((_, i) =>
            `<div class="carousel-dot ${i===0?'active':''}" onclick="event.stopPropagation();goTo(${bi},${i})"></div>`
          ).join('')}</div>`
        : '';

      const countHtml = hasMultiple
        ? `<div class="carousel-count">1 / ${b.photos.length}</div>`
        : '';

      const findSpec = label => (b.specs.find(s => s.label === label) || {}).value || '';
      const blankVal = findSpec('Blank');
      const lengthRaw = findSpec('Length');           // e.g. "8'0\" · 20-40lb"
      const lineWtSpec = findSpec('Line Weight');     // explicit spec, if provided separately
      const [lengthSplit, lengthSplitWt] = lengthRaw.split(' · ');
      const lengthVal = lineWtSpec ? lengthRaw : lengthSplit;
      const lineWtVal = lineWtSpec || lengthSplitWt;

      const miniSpecsHtml = `
        <div class="build-specs">
          <div class="build-spec">
            <span class="build-spec-label">Blank</span>
            <span class="build-spec-value">${blankVal}</span>
          </div>
          <div class="build-spec">
            <span class="build-spec-label">Length</span>
            <span class="build-spec-value">${lengthVal || ''}</span>
          </div>
          <div class="build-spec">
            <span class="build-spec-label">Line Weight</span>
            <span class="build-spec-value">${lineWtVal || ''}</span>
          </div>
        </div>
      `;

      return `
        <div class="build-card" onclick="goToBuild('${b.page}')">
          <div class="carousel" id="carousel-${bi}">
            <div class="carousel-track" id="track-${bi}">${slidesHtml}</div>
            ${hasMultiple ? `
              <button class="carousel-btn prev hidden" id="prev-${bi}" onclick="event.stopPropagation();slide(${bi},-1)">‹</button>
              <button class="carousel-btn next" id="next-${bi}" onclick="event.stopPropagation();slide(${bi},1)">›</button>
            ` : ''}
            ${dotsHtml}
            ${countHtml}
          </div>
          <div class="build-info">
            <div class="build-rod-type">${b.rodType}</div>
            ${miniSpecsHtml}
            <div class="build-view-link">View Full Details →</div>
          </div>
        </div>
      `;
    }).join('');
  }

  const currentSlide = {};

  function slide(bi, dir) {
    const build = RENDER_BUILDS[bi];
    currentSlide[bi] = (currentSlide[bi] || 0) + dir;
    if (currentSlide[bi] < 0) currentSlide[bi] = 0;
    if (currentSlide[bi] >= build.photos.length) currentSlide[bi] = build.photos.length - 1;
    updateCarousel(bi);
  }

  function goTo(bi, idx) {
    currentSlide[bi] = idx;
    updateCarousel(bi);
  }

  function updateCarousel(bi) {
    const idx = currentSlide[bi] || 0;
    const build = RENDER_BUILDS[bi];
    const total = build.photos.length;

    document.getElementById('track-' + bi).style.transform = `translateX(-${idx * 100}%)`;

    // Dots
    const dots = document.querySelectorAll(`#carousel-${bi} .carousel-dot`);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));

    // Count
    const countEl = document.querySelector(`#carousel-${bi} .carousel-count`);
    if (countEl) countEl.textContent = `${idx + 1} / ${total}`;

    // Buttons
    const prevBtn = document.getElementById('prev-' + bi);
    const nextBtn = document.getElementById('next-' + bi);
    if (prevBtn) prevBtn.classList.toggle('hidden', idx === 0);
    if (nextBtn) nextBtn.classList.toggle('hidden', idx === total - 1);
  }

  renderBuilds();
</script>
</body>
</html>
